name: phpunit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'

env:
  DOCKER_EXMENT_REPOSITORY: exceedone/docker-exment
  # docker-exment master as of 2026-05-13 (PHP 8.2), the one v6.2.15 was tested on
  DOCKER_EXMENT_REF: 9246d52e6a57a0c58b0e0e1fb3012d856ad83495
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate
  # The last Laravel 10 / exceedone/laravel-admin commit of exment-boilerplate.
  # main is for Exment v7 (Laravel 12, exment-admin-core) since 2026-10-28.
  EXMENT_BOILERPLATE_REF: a5f5cdf4340f1b0074d1e135adcc92d64faf2647

jobs:
  exment-testing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql", "mariadb"]
        test: ["feature", "unit", "browser"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY}}
          ref: ${{ env.DOCKER_EXMENT_REF }}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY}}
          ref: ${{ env.EXMENT_BOILERPLATE_REF }}
          path: ./docker-exment/exment-boilerplate

      - uses: actions/checkout@v4
        with:
          path: ./docker-exment/exment-boilerplate/exment
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make ${{ matrix.db }} up
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-up

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Make ${{ matrix.db }} Initialize
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-init

      # composer.dev.lock of that boilerplate commit has exceedone/laravel-admin v4.0.0;
      # Exment 6.2 needs ^4.2.3 (the security fixes of v6.2.17)
      - name: Update exceedone/laravel-admin
        working-directory: docker-exment
        run: |
          # composer update cannot resolve the path repository of exment here, so the package is replaced by the tag
          docker compose -f docker-compose.yml exec -T php sh -c 'rm -rf vendor/exceedone/laravel-admin && git clone -q --depth 1 -b v4.2.3 https://github.com/exceedone/laravel-admin.git vendor/exceedone/laravel-admin && composer dump-autoload -q'
          docker compose -f docker-compose.yml exec -T php grep -c '@json' vendor/exceedone/laravel-admin/resources/views/partials/toastr.blade.php

      - name: PHPUnit Test
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php composer run exment:test:${{ matrix.test }}
