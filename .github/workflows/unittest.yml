name: phpunit

on:
  pull_request:
    paths:
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'

env:
  DOCKER_EXMENT_REPOSITORY: exceedone/docker-exment
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate
  EXMENT_ADMIN_CORE_REPOSITORY: exceedone/exment-admin-core
  EXMENT_REPOSITORY: exceedone/exment
  

jobs:
  exment-testing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql", "mariadb"]
        test: ["feature", "unit", "browser"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY}}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate
          ref: feature/laravel-12

      # pull_request chay CI o repo base cua PR. Khi PR mo sang repo khac (vi du
      # ex1nhatvh/exment) thi checkout mac dinh tro ve repo base, ma repo do khong
      # co branch nay -> fail. Ghim repository de luon lay code tu exceedone/exment.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate/exment
          ref: feature/v7.0

      # exment-boilerplate require ca exceedone/exment-admin-core (dev-master).
      # Bat buoc branch master: composer doan version cua path repository theo ten branch
      # dang checkout, branch khac se ra dev-<branch> va khong khop rang buoc dev-master.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_ADMIN_CORE_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate/exment-admin-core
          ref: master

      # composer.dev.lock da tro exceedone/exment-admin-core vao ./exment-admin-core, nhung
      # composer.dev.json lai thieu repository tuong ung nen composer install khong tim thay
      # thu muc nguon. Va vao day thay vi sua repo exment-boilerplate de CI khong phai cho
      # mot PR o repo khac. Sua composer.dev.json lam lech content-hash cua lock, composer
      # chi canh bao "lock file is not up to date" roi van cai tiep tu lock.
      - name: Add exment-admin-core to composer.dev.json
        working-directory: docker-exment/exment-boilerplate
        run: |
          php -r '
            $file = "composer.dev.json";
            $json = json_decode(file_get_contents($file), true);
            $repositories = $json["repositories"] ?? [];
            foreach ($repositories as $repository) {
                if (($repository["url"] ?? "") === "./exment-admin-core") {
                    echo "already registered", PHP_EOL;
                    exit(0);
                }
            }
            $repositories[] = ["type" => "path", "url" => "./exment-admin-core", "options" => ["symlink" => true]];
            $json["repositories"] = $repositories;
            file_put_contents($file, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL);
            echo "added", PHP_EOL;
          '

      # Chi de do cho checklist v7: ghi lai moi request va lenh artisan ma test THAT SU chay
      # (method, route, action, status, ten test) vao storage/logs/route_coverage.tsv.
      # Chi them 1 service provider vao app boilerplate cua CI, khong doi code exment.
      - name: Add the route coverage recorder
        working-directory: docker-exment/exment-boilerplate
        run: |
          cat > app/Providers/RouteCoverageServiceProvider.php <<'PHP'
          <?php

          namespace App\Providers;

          use Illuminate\Console\Events\CommandFinished;
          use Illuminate\Foundation\Http\Events\RequestHandled;
          use Illuminate\Routing\Route;
          use Illuminate\Support\ServiceProvider;
          use PHPUnit\Framework\TestCase;

          class RouteCoverageServiceProvider extends ServiceProvider
          {
              public function boot(): void
              {
                  $file = storage_path('logs/route_coverage.tsv');
                  $events = $this->app['events'];

                  // Laravel 12 turns the console command events on only outside unit tests
                  // (console Kernel::__construct), and the artisan application takes the event
                  // dispatcher when it is built: turn them on and let it be built again
                  $kernel = $this->app->make(\Illuminate\Contracts\Console\Kernel::class);
                  if (method_exists($kernel, 'rerouteSymfonyCommandEvents')) {
                      $kernel->rerouteSymfonyCommandEvents();
                      $kernel->setArtisan(null);
                  }

                  $events->listen(RequestHandled::class, function (RequestHandled $event) use ($file) {
                      try {
                          $route = $event->request->route();
                          $isRoute = $route instanceof Route;
                          $response = $event->response;
                          $ex = $response->exception ?? null;
                          $exception = $ex instanceof \Throwable ? get_class($ex) . ': ' . substr($ex->getMessage(), 0, 400) . ' @ ' . basename($ex->getFile()) . ':' . $ex->getLine() : "-";
                          $errors = $event->request->hasSession() && $event->request->session()->has('errors') ? 1 : 0;
                          self::write($file, [
                              $event->request->method(),
                              $isRoute ? implode('|', $route->methods()) : "-",
                              $isRoute ? $route->uri() : "-",
                              $isRoute ? $route->getActionName() : "-",
                              $response->getStatusCode(),
                              $errors,
                              $exception,
                              (string) parse_url((string) $response->headers->get('Location'), PHP_URL_PATH),
                              $event->request->path(),
                          ]);
                      } catch (\Throwable $e) {
                          // the recorder must never change a test result
                      }
                  });

                  $events->listen(CommandFinished::class, function (CommandFinished $event) use ($file) {
                      try {
                          self::write($file, ['CLI', 'CLI', (string) $event->command, "-", $event->exitCode, 0, "-", "-", "-"]);
                      } catch (\Throwable $e) {
                          // the recorder must never change a test result
                      }
                  });
              }

              /**
               * @param array<int, mixed> $fields
               */
              private static function write(string $file, array $fields): void
              {
                  // the outermost frame of a test class is the test method that sent the request
                  $test = "-";
                  foreach (debug_backtrace(DEBUG_BACKTRACE_IGNORE_ARGS) as $frame) {
                      if (isset($frame['class']) && is_subclass_of($frame['class'], TestCase::class)) {
                          $test = $frame['class'] . '::' . $frame['function'];
                      }
                  }
                  $fields[] = $test;
                  $fields = str_replace(["\t", "\n", "\r"], ' ', array_map('strval', $fields));
                  file_put_contents($file, implode("\t", $fields) . "\n", FILE_APPEND | LOCK_EX);
              }
          }
          PHP
          # the CI boilerplate lists its providers in config/app.php (no bootstrap/providers.php)
          php -r '$f = "config/app.php"; $b = chr(92); $a = "App{$b}Providers{$b}AppServiceProvider::class,"; $s = str_replace($a, $a . PHP_EOL . "        App{$b}Providers{$b}RouteCoverageServiceProvider::class,", (string) file_get_contents($f), $n); if ($n !== 1) { echo "config/app.php not patched", PHP_EOL; exit(1); } file_put_contents($f, $s); echo "providers patched", PHP_EOL;'
          grep -n "Providers.*ServiceProvider::class" config/app.php

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make ${{ matrix.db }} up
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-up

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Make ${{ matrix.db }} Initialize
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-init

      # Chi o test-ci, khong merge: test tam ghi lai noi dung that cua cac man hinh/ajax chi smoke
      # test cham toi (dong PROBE trong route_coverage.tsv), de viet test noi dung chinh xac.
      - name: Add the screen content probe
        if: matrix.test == 'feature'
        run: |
          echo '' | base64 -d > docker-exment/exment-boilerplate/exment/tests/Feature/ScreenContentProbeTest.php
          wc -l docker-exment/exment-boilerplate/exment/tests/Feature/ScreenContentProbeTest.php
      - name: PHPUnit Test
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php composer run exment:test:${{ matrix.test }}

      # token/refresh khong co test (moi request deu 500 tu v6, khong viet test khoa loi):
      # goi that 1 lan sau khi test xong de checklist co ket qua chay that.
      - name: Probe the route no test calls
        if: always() && matrix.test == 'feature'
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          foreach (['/admin/oauth/token/refresh'] as $uri) {
              $response = $kernel->handle(Illuminate\Http\Request::create($uri, 'GET'));
              $e = $response->exception ?? null;
              echo 'PROBE GET ', $uri, ' -> ', $response->getStatusCode(), $e ? ' ' . get_class($e) . ': ' . $e->getMessage() : "", PHP_EOL;
          }
          PHP

      - name: Collect the route coverage log
        if: always()
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php sh -c 'cat storage/logs/route_coverage.tsv' > route_coverage.tsv || true
          wc -l route_coverage.tsv
          cut -f1 route_coverage.tsv | sort | uniq -c

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-coverage-${{ matrix.db }}-${{ matrix.test }}-${{ github.run_attempt }}
          path: docker-exment/route_coverage.tsv
          retention-days: 30
