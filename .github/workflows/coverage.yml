name: coverage

on:
  # Coverage takes long, so it does not run on every pull request.
  push:
    branches:
      - master
  schedule:
    - cron: '0 18 * * 0'   # every Monday 03:00 JST
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/coverage.yml'

env:
  DOCKER_EXMENT_REPOSITORY: exceedone/docker-exment
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate
  DOCKER_EXMENT_REF: master

# a newer push to the pull request stops the run of the push before (fewer runs waiting for a runner)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY }}
          ref: ${{ env.DOCKER_EXMENT_REF }}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY }}
          path: ./docker-exment/exment-boilerplate

      - uses: actions/checkout@v4
        with:
          path: ./docker-exment/exment-boilerplate/exment
          ref: ${{ github.event.pull_request.head.sha }}

      # composer.dev.lock of exment-boilerplate installs exment-admin-core from the path ./exment-admin-core
      - uses: actions/checkout@v4
        with:
          repository: exceedone/exment-admin-core
          # Exment 7.3 is built on the 2.x line of admin-core (ISS02862)
          ref: 2.x
          path: ./docker-exment/exment-boilerplate/exment-admin-core

      # the downloads of composer are kept between runs (fewer downloads: faster, and fewer
      # network failures). The folder is in exment-boilerplate, which the php container mounts.
      - name: Cache the composer downloads
        uses: actions/cache@v4
        with:
          path: ./docker-exment/exment-boilerplate/.composer-cache
          key: composer-${{ hashFiles('docker-exment/exment-boilerplate/composer.dev.lock') }}
          restore-keys: composer-

      - name: Composer uses the kept downloads
        run: printf '\nCOMPOSER_CACHE_DIR=/var/www/exment/.composer-cache\n' >> docker-exment/.env

      # the php image of docker-exment, built with its layers kept between runs (the OS packages
      # and the SQL Server drivers are not made again each time). Tagged with the name docker
      # compose gives it (docker-exment-php), so "up" uses it and does not build it again.
      - name: The PHP version of docker-exment
        id: php
        run: echo "version=$(grep -E '^EXMENT_DOCKER_PHP_VERSION=' docker-exment/.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the php image (kept layers)
        uses: docker/build-push-action@v6
        with:
          context: ./docker-exment/docker/php
          build-args: PHP_VERSION=${{ steps.php.outputs.version }}
          tags: docker-exment-php:latest
          load: true
          cache-from: type=gha,scope=docker-exment-php-${{ steps.php.outputs.version }}
          cache-to: type=gha,mode=max,scope=docker-exment-php-${{ steps.php.outputs.version }}

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make mysql up
        working-directory: docker-exment
        run: make mysql-up

      - name: Copy composer.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock
          # admin-core 2.x (ISS02862): the boilerplate takes it as "dev-master as 1.0.x". Here
          # dev-master stands for 2.99.0 (the newest of the 2.x line), in the json and in the lock (its alias, and the requirement
          # of exment it keeps), so exment's ^2.1.1 is met.
          git -C exment-boilerplate/exment-admin-core checkout -B master
          docker compose -f docker-compose.yml exec -T php sed -i -E -e 's/"dev-master as 1\.[0-9.]+"/"dev-master as 2.99.0"/' -e 's/"alias": "1\.[0-9.]+"/"alias": "2.99.0"/' -e 's/"alias_normalized": "1\.[0-9.]+"/"alias_normalized": "2.99.0.0"/' -e 's#"exceedone/exment-admin-core": "\^1\.[0-9.]+"#"exceedone/exment-admin-core": "^2.0"#' composer.json composer.lock

      - name: Initialize database and app
        working-directory: docker-exment
        run: make mysql-init

      # the database accepts the user of the app a little after the container is up (see unittest.yml)
      - name: Wait for the database
        working-directory: docker-exment
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml exec -T php php artisan exment:check-connection 2>/dev/null | grep -qx 'Connected'; then
              echo "the database accepts the app user (try $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the database did not accept the app user in 120 seconds"
          exit 1

      - name: Run unit + feature with coverage and merge
        working-directory: docker-exment
        run: make test-coverage

      - name: Show coverage summary in job summary
        working-directory: docker-exment
        if: always()
        run: |
          {
            echo "## Coverage (unit + feature merged)"
            echo '```'
            cat exment-boilerplate/storage/logs/coverage/merged/summary.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            docker-exment/exment-boilerplate/storage/logs/coverage/merged/clover.xml
            docker-exment/exment-boilerplate/storage/logs/coverage/merged/html
            docker-exment/exment-boilerplate/storage/logs/coverage/merged/summary.txt
          if-no-files-found: warn
          retention-days: 14

      # Codecov upload. No token needed for public repos; for private repos add
      # CODECOV_TOKEN to repository secrets.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: docker-exment/exment-boilerplate/storage/logs/coverage/merged/clover.xml
          flags: unit-feature
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
