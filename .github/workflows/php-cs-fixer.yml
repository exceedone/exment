name: php-cs-fixer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3"]
    steps:
      # Code cua chinh PR (head), lay theo repo + sha cua head: PR chay CI o repo base, ma repo
      # base co the la repo khac (vi du ex1nhatvh/exment) khong co nhanh head.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Prepare
        run: |
          wget https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer
          chmod a+x php-cs-fixer

      - name: Versions
        run: |
          cat /etc/os-release
          php -v
          php php-cs-fixer --version

      - name: Execute php-cs-fixer
        run: |
          php php-cs-fixer fix --dry-run -v --diff ./src
          php php-cs-fixer fix --dry-run -v --diff ./tests
