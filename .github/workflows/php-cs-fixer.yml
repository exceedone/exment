name: php-cs-fixer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

# Pin the fixer version so upstream rule changes don't break CI unexpectedly.
# When bumping, update both values (sha256 of the release's php-cs-fixer.phar).
env:
  PHP_CS_FIXER_VERSION: 3.94.2
  PHP_CS_FIXER_SHA256: aaafc3a53b877c6741ddccac0a783f0fb73fff5f84fba5870d5dd306ee22dde0

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Prepare
        run: |
          wget "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar" -O php-cs-fixer
          echo "${PHP_CS_FIXER_SHA256}  php-cs-fixer" | sha256sum -c -
          chmod a+x php-cs-fixer

      - name: Versions
        run: |
          cat /etc/os-release
          php -v
          php php-cs-fixer --version

      - name: Execute php-cs-fixer
        run: |
          php php-cs-fixer fix --dry-run -v --diff ./src
          php php-cs-fixer fix --dry-run -v --diff ./tests
