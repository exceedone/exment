name: php-cs-fixer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

env:
  EXMENT_REPOSITORY: exceedone/exment

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3"]
    steps:
      # Ghim repository: PR chay CI o repo base, checkout mac dinh se tim branch nay
      # o repo base va fail neu do la repo khac (vi du ex1nhatvh/exment).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_REPOSITORY}}
          ref: feature/laravel-12-new-code

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Prepare
        run: |
          wget https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer
          chmod a+x php-cs-fixer

      - name: Versions
        run: |
          cat /etc/os-release
          php -v
          php php-cs-fixer --version

      - name: Execute php-cs-fixer
        run: |
          php php-cs-fixer fix --dry-run -v --diff ./src
          php php-cs-fixer fix --dry-run -v --diff ./tests
