<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | Exment modern UI sample</title>
<style>
/* ---- tokens: same names and values as public/vendor/exment/css/modern.css ---- */
:root{
  --exm-ui-accent:#2563eb; --exm-ui-accent-strong:#1d4ed8; --exm-ui-accent-soft:#eff4ff; --exm-ui-accent-ring:rgba(37,99,235,.22);
  --exm-ui-text:#1c2024; --exm-ui-text-sub:#5f6b7a; --exm-ui-text-faint:#8b95a1;
  --exm-ui-bg:#ffffff; --exm-ui-bg-sub:#f7f8f9; --exm-ui-bg-hover:#f3f5f7; --exm-ui-line:#e6e8eb; --exm-ui-line-soft:#eff1f3;
  --exm-ui-danger:#d1242f;
  --exm-ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --exm-ui-fs-xs:12px; --exm-ui-fs-sm:13px; --exm-ui-fs-md:14px; --exm-ui-fs-lg:18px; --exm-ui-fs-xl:24px;
  --exm-ui-space-1:4px; --exm-ui-space-2:8px; --exm-ui-space-3:12px; --exm-ui-space-4:16px; --exm-ui-space-5:24px; --exm-ui-space-6:32px; --exm-ui-space-7:48px;
  --exm-ui-radius-sm:6px; --exm-ui-radius-md:10px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--exm-ui-font);font-size:var(--exm-ui-fs-md);line-height:1.6;color:var(--exm-ui-text);background:var(--exm-ui-bg)}
a{color:var(--exm-ui-accent-strong);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:0;box-shadow:0 0 0 3px var(--exm-ui-accent-ring);border-radius:var(--exm-ui-radius-sm)}
.mark{width:28px;height:28px;flex:0 0 auto}

/* ---- buttons: one filled (the main action), the rest quiet ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;font-size:var(--exm-ui-fs-sm);font-weight:600;white-space:nowrap;color:var(--exm-ui-text-sub);background:var(--exm-ui-bg);border:1px solid var(--exm-ui-line);border-radius:var(--exm-ui-radius-sm);cursor:pointer;text-decoration:none}
.btn:hover{color:var(--exm-ui-text);background:var(--exm-ui-bg-hover);text-decoration:none}
.btn-primary{color:#fff;background:var(--exm-ui-accent);border-color:var(--exm-ui-accent)}
.btn-primary:hover{color:#fff;background:var(--exm-ui-accent-strong);border-color:var(--exm-ui-accent-strong)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-lg{height:42px;font-size:var(--exm-ui-fs-md)}

/* ---- fields ---- */
.input{width:100%;height:38px;padding:0 var(--exm-ui-space-3);background:var(--exm-ui-bg);border:1px solid var(--exm-ui-line);border-radius:var(--exm-ui-radius-sm);transition:border-color .12s,box-shadow .12s}
textarea.input{height:auto;padding:10px var(--exm-ui-space-3);resize:vertical;line-height:1.6}
.input::placeholder{color:var(--exm-ui-text-faint)}
.input:hover{border-color:#cfd4da}
.input:focus{border-color:var(--exm-ui-accent);box-shadow:0 0 0 3px var(--exm-ui-accent-ring);outline:0}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--exm-ui-accent)}

/* ---- small parts ---- */
.tag{display:inline-block;padding:1px 8px;font-size:var(--exm-ui-fs-xs);line-height:1.6;color:var(--exm-ui-text-sub);background:var(--exm-ui-bg-sub);border:1px solid var(--exm-ui-line);border-radius:999px;white-space:nowrap}
.tag-accent{color:var(--exm-ui-accent-strong);background:var(--exm-ui-accent-soft);border-color:transparent}
.muted{color:var(--exm-ui-text-sub)}
.faint{color:var(--exm-ui-text-faint)}
.num{font-variant-numeric:tabular-nums}

body{background:var(--exm-ui-bg-sub)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--exm-ui-space-6) var(--exm-ui-space-4)}
.site{display:flex;align-items:center;gap:12px;margin-bottom:var(--exm-ui-space-5);font-size:var(--exm-ui-fs-xl);font-weight:700}
.site .mark{width:40px;height:40px}
.card{width:380px;max-width:100%;padding:var(--exm-ui-space-6);background:var(--exm-ui-bg);border:1px solid var(--exm-ui-line);border-radius:var(--exm-ui-radius-md)}
.card h1{font-size:var(--exm-ui-fs-lg);font-weight:600;margin-bottom:var(--exm-ui-space-5)}
.f{margin-bottom:var(--exm-ui-space-4)}
.f .input{height:42px}
.keep{display:flex;align-items:center;gap:8px;margin:var(--exm-ui-space-1) 0 var(--exm-ui-space-5);font-size:var(--exm-ui-fs-sm);color:var(--exm-ui-text-sub)}
.card .btn{width:100%}
.forget{margin-top:var(--exm-ui-space-4);text-align:center;font-size:var(--exm-ui-fs-sm)}
.or{display:flex;align-items:center;gap:var(--exm-ui-space-3);margin:var(--exm-ui-space-5) 0 var(--exm-ui-space-4);font-size:var(--exm-ui-fs-xs);color:var(--exm-ui-text-faint)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--exm-ui-line)}
.foot{margin-top:var(--exm-ui-space-5);font-size:var(--exm-ui-fs-xs);color:var(--exm-ui-text-faint)}
.foot a{color:var(--exm-ui-text-faint)}
</style>
</head>
<body>
<div class="login">
  <div class="site"><svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><rect x="4" y="4" width="112" height="112" rx="26" fill="url(#g)"/><rect x="28" y="27" width="18" height="18" rx="4" fill="#bfdbfe"/><rect x="52" y="27" width="40" height="18" rx="4" fill="#fff"/><rect x="28" y="51" width="18" height="18" rx="4" fill="#bfdbfe"/><rect x="52" y="51" width="28" height="18" rx="4" fill="#fff"/><rect x="28" y="75" width="18" height="18" rx="4" fill="#bfdbfe"/><rect x="52" y="75" width="40" height="18" rx="4" fill="#fff"/></svg><span>Exment</span></div>
  <form class="card" action="dashboard.html">
    <h1>ログイン</h1>
    <div class="f"><input class="input" type="text" placeholder="メールアドレスorユーザーコード" aria-label="メールアドレスorユーザーコード" autocomplete="username"></div>
    <div class="f"><input class="input" type="password" placeholder="パスワード" aria-label="パスワード" autocomplete="current-password"></div>
    <label class="keep"><input type="checkbox"> ログイン状態を保持する</label>
    <button class="btn btn-primary btn-lg" type="submit">ログイン</button>
    <p class="forget"><a href="#">パスワードを忘れた</a></p>
    <div class="or">OR</div>
    <a class="btn btn-lg" href="#">Microsoftでログイン</a>
  </form>
  <p class="foot">デザインサンプル（静的HTML） ・ <a href="index.html">サンプル一覧へ</a></p>
</div>
</body>
</html>
